    <script>
      // Suppress benign ResizeObserver notifications loop errors from widgets and browser layout shifts
      (function() {
        var errorHandler = function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (
            typeof msg === 'string' &&
            (msg.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
             msg.indexOf('ResizeObserver loop limit exceeded') !== -1)
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        };
        window.addEventListener('error', errorHandler, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason && (e.reason.message || e.reason));
          if (
            typeof reason === 'string' &&
            (reason.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
             reason.indexOf('ResizeObserver loop limit exceeded') !== -1)
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
