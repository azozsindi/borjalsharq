<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="35%" stop-color="#F5E4B2" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#99732B" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D92D20" />
      <stop offset="100%" stop-color="#B42318" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#C5A059" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Aerodynamic Silhouette Curve -->
  <g filter="url(#goldGlow)">
    <path d="M 60 75 C 90 40, 160 22, 250 20 C 330 18, 410 32, 450 72" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 210 58 C 230 25, 340 12, 470 20 C 455 35, 435 55, 430 65" 
          fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="468" cy="22" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: برج الشارقة -->
  <text x="250" y="130" text-anchor="middle" font-family="'Alexandria', 'Tajawal', 'IBM Plex Sans Arabic', sans-serif" font-weight="900" font-size="52" fill="url(#goldGrad)" letter-spacing="1">
    برج الشارقة
  </text>

  <!-- Subtitle: لزينة السيارات -->
  <text x="250" y="172" text-anchor="middle" font-family="'Alexandria', 'Tajawal', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="24" fill="url(#redGrad)" letter-spacing="3">
    لزينة السيارات
  </text>
</svg>
